# ==============================================================================
# CivicTracker TW — AI 雙模型協作與資料管線設定檔 (人類維護版 Human-Readable Config)
# ------------------------------------------------------------------------------
# 說明：
# 1. 本檔案為人類開發者與領域專家維護的唯一真實來源 (Single Source of Truth)。
# 2. 執行 `python -m backend.core.config_compiler` 後，系統會自動驗證型別並將本檔編譯為
#    高密度、零歧義的 `config/generated/agent_protocol.json` 供 Hydrogen 與 Argon 溝通。
# ==============================================================================

version: "1.0.0"
project_name: "CivicTracker-TW"

# 系統評估運作模式 (預設採用 0 Token 中立客觀數據量化模式)
# 可選值: "QUANTITATIVE_ONLY" (預設 0 Token 規則與公式量化) | "HYBRID_ON_DEMAND" | "FULL_DUAL_MODEL" (未來量能充足再開啟)
evaluation_mode: "QUANTITATIVE_ONLY"

# ------------------------------------------------------------------------------
# 功能開關 (Feature Flags — 控制立法院 API、影音串流、期中考評與公民連署功能)
# ------------------------------------------------------------------------------
feature_flags:
  enable_ly_govapi_live_sync: true
  enable_ivod_video_embed: true
  enable_billy3321_integration: true
  enable_exam_report_cards: true
  enable_citizen_petitions: true
  enable_llm_deep_evaluation: false   # 預設關閉外部大模型推論(0 Token 消耗)，未來量能充足再改為 true

# ------------------------------------------------------------------------------
# 佐證等級與量化政策 (Evidence Tier Policy — 客觀公開標案與公報優先)
# ------------------------------------------------------------------------------
evidence_tier_policy:
  tier1_official_sources:
    - "中選會選舉公報"
    - "政府電子採購網(PCC)"
    - "立法院開放資料/公報"
    - "審計部決算報告"
    - "各縣市總預算與施政報告"
  include_news_media: false
  policy_note: "新聞媒體真實性存疑，預設不計入執行率量化，僅作預留背景參考槽位；執行率與成果全數由 Tier-1 政府公開標案、法定公報與決算客觀量化。"

# ------------------------------------------------------------------------------
# 外部整合端點 (External Service Endpoints)
# ------------------------------------------------------------------------------
external_endpoints:
  ly_govapi_v2_url: "https://v2.ly.govapi.tw"
  ly_open_data_url: "https://data.ly.gov.tw"
  ivod_official_base_url: "https://ivod.ly.gov.tw"
  billy3321_ivod_base_url: "https://ivod.billy3321.tw"
  github_discussions_repo: "civic-tracker-tw/civic-tracker-tw"

# ------------------------------------------------------------------------------
# 1. 雙模型角色設定 (Hydrogen 執行者 × Argon 決策與錯誤評估者)
# ------------------------------------------------------------------------------
models:
  executor:
    agent_alias: "hydrogen"
    provider_model: "gemini-2.5-flash"
    temperature: 0.1
    max_retries_on_reject: 2
    description: "負責高吞吐量之立法院公報逐字稿清理、時間軸對齊、議題標籤抽取與政見初步結構化"

  evaluator:
    agent_alias: "argon"
    provider_model: "gemini-4-argon"
    temperature: 0.0
    strict_evidence_check: true
    description: "負責決策路由、審查 Hydrogen 產出是否有幻覺或語者錯置，並對首長政見兌現度進行最終裁決"

# ------------------------------------------------------------------------------
# 2. 任務品質門檻與審查規則 (Quality Gates & Routing Rules)
# ------------------------------------------------------------------------------
quality_gates:
  # [Phase 1] 國會/議會質詢逐字稿摘要與語者分離
  interpellation_transcript:
    task_code: "TASK_SPEECH_PARSE"
    min_executor_confidence: 0.85   # Hydrogen 自評信心低於 0.85 時，強制升級由 Argon 審查
    sample_audit_rate: 0.20         # 即使信心達標，Argon 仍隨機抽檢 20% 樣本確保品質
    require_timestamp_bounds: true  # 必須具備合法的 IVOD 影片起訖秒數 (start_sec <= end_sec)
    check_speaker_attribution: true # 嚴格檢查是否混淆「質詢立委/議員」與「備詢官員/市長」

  # [Phase 1] 法案記名表決與立場分析
  roll_call_vote_analysis:
    task_code: "TASK_VOTE_ANALYZE"
    min_executor_confidence: 0.90
    sample_audit_rate: 0.15
    allowed_vote_decisions:
      - "APPROVE"     # 贊成
      - "REJECT"      # 反對
      - "ABSTAIN"     # 棄權
      - "ABSENT"      # 缺席/請假

  # [Phase 2] 縣市長/執政者政見承諾與執行成果評估
  executive_policy_fulfillment:
    task_code: "TASK_POLICY_EVAL"
    min_executor_confidence: 0.95
    always_require_argon_verdict: true  # 政見兌現評估一律由 Hydrogen 彙整證據、Argon 最終裁決
    require_verifiable_citation: true   # 必須附帶預算書、政府採購標案或公報之原始連結
    allowed_fulfillment_statuses:
      - "NOT_STARTED" # 未啟動
      - "IN_PLANNING" # 規劃中/編列預算中
      - "IN_PROGRESS" # 執行中/工程發包中
      - "FULFILLED"   # 已兌現
      - "STALLED"     # 卡關/進度落後
      - "BROKEN"      # 跳票或政策變更

  # [Phase 2] 公民檢舉、連署與即時通報分流審查
  citizen_petition_triage:
    task_code: "TASK_PETITION_TRIAGE"
    min_executor_confidence: 0.85
    always_require_argon_verdict: true  # 公民通報一律由 Argon 進行人身攻擊與不實謾罵防護裁決
    require_verifiable_citation: false

# ------------------------------------------------------------------------------
# 3. Argon 標準錯誤評估碼 (Standard Error Codes for Model-to-Model Rejection)
# 當 Argon 退回 Hydrogen 的執行結果時，使用以下標準錯誤碼與修正指令，避免自然語言歧義
# ------------------------------------------------------------------------------
error_catalog:
  - code: "E01_HALLUCINATION"
    severity: "CRITICAL"
    human_label: "事實幻覺或超譯"
    model_directive: "Output contains claims not grounded in raw transcript or official document. Strip unsupported claims."

  - code: "E02_SPEAKER_SWAP"
    severity: "CRITICAL"
    human_label: "質詢者與備詢官員語者錯置"
    model_directive: "Confused statements made by the questioning legislator with responses from the executive official. Re-attribute speaker turns."

  - code: "E03_MISSING_CITATION"
    severity: "HIGH"
    human_label: "缺乏可驗證之原始資料出處"
    model_directive: "Policy milestone or vote record lacks a valid source_url or gazette reference. Attach exact provenance."

  - code: "E04_TIMESTAMP_DRIFT"
    severity: "MEDIUM"
    human_label: "影音時間軸秒數異常"
    model_directive: "Video start_time_sec/end_time_sec is inverted or out of session bounds. Recalculate timestamps."

  - code: "E05_SCHEMA_VIOLATION"
    severity: "HIGH"
    human_label: "結構化欄位或枚舉值不符規範"
    model_directive: "Payload violates enum constraints or required fields in agent_protocol.json. Conform strictly to schema."

  - code: "E06_UNSUBSTANTIATED_ABUSE"
    severity: "HIGH"
    human_label: "無實證之不當檢舉或人身攻擊謾罵"
    model_directive: "Petition contains unsubstantiated defamation, abusive language, or zero public interest evidence. Quarantine and reject payload."

# ------------------------------------------------------------------------------
# 4. 資料源配置 (Data Sources — 支援台灣立法院與後續縣市擴充)
# ------------------------------------------------------------------------------
data_sources:
  phase1_legislative:
    - id: "ly_open_data"
      name: "立法院開放資料服務平臺 (委員、法案、表決、公報)"
      base_url: "https://data.ly.gov.tw"
      enabled: true
    - id: "ly_ivod"
      name: "立法院議事轉播網際網路多媒體隨選視訊系統 (IVOD)"
      base_url: "https://ivod.ly.gov.tw"
      enabled: true
  phase2_executive:
    - id: "cec_bulletin"
      name: "中央選舉委員會選舉公報 (首長政見原文)"
      base_url: "https://bulletin.cec.gov.tw"
      enabled: true
    - id: "pcc_tenders"
      name: "政府電子採購網 (工程與標案執行進度)"
      base_url: "https://web.pcc.gov.tw"
      enabled: true
